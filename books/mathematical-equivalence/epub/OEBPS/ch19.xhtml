<html xmlns="http://www.w3.org/1999/xhtml"><head><title>第十七章　判断两个陈述是否等价的流程</title><link rel="stylesheet" href="style.css"/></head><body><h2 id="第十七章-判断两个陈述是否等价的流程">第十七章　判断两个陈述是否等价的流程</h2>
<ol>
<li><strong>类型检查</strong>：它是项、开放公式、句子、理论、结构，还是算法问题？</li>
<li><strong>冻结背景</strong>：语言、论域、逻辑、理论和证明演算是什么？</li>
<li><strong>补齐变量</strong>：自由变量是否要保留赋值，还是要全称/存在闭包？</li>
<li><strong>标明箭头</strong>：<span class="math-inline"><math xmlns="http://www.w3.org/1998/Math/MathML" display="inline"><mrow><mo>→</mo><mo>,</mo><mo>⇒</mo><mo>,</mo><mo>⊧</mo><mo>,</mo><mo>⊢</mo><mo>,</mo><mo>≤</mo></mrow></math></span> 分别表示什么？</li>
<li><strong>找反例或给双向构造</strong>：单箭头只需一个反例推翻；双向关系要两条独立论证。</li>
<li><strong>报告假设</strong>：有限性、域、排序、可满足性、算法模型是否已写明？</li>
<li><strong>审查层级</strong>：若出现理论名、公理模式或编码约定，是否已把它改写为合法的元理论断言？</li>
</ol>
</body></html>
