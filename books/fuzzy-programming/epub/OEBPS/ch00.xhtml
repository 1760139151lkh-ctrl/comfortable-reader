<html xmlns="http://www.w3.org/1999/xhtml"><head><title>模糊规划：把“差不多”变成可计算的决定</title><link rel="stylesheet" href="style.css"/></head><body><header class="cover">
<h1 id="模糊规划把差不多变成可计算的决定">模糊规划：把“差不多”变成可计算的决定</h1>
<p class="subtitle">从软约束、满意度到模型选择：一份面向初学者的对话式介绍</p>
</header>
<div class="route">
<p>这不是聊天记录的逐字装订，而是一条完整的讲解路线。我们从一句现实中的“最好不要超过”出发，逐步追问：它到底是不是硬约束？满意度从哪里来？什么时候需要 <span class="formula">α</span>，什么时候才需要 <span class="formula">λ</span>？</p>
<p>请把全书的核心判断先记住：模糊规划不是把所有数字变成“差不多”，而是把自然语言里的容忍、偏好和优先级，翻译成可以计算、可以比较、也可以质疑的数学结构。</p>
</div>
</body></html>
