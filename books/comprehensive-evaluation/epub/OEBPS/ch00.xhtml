<html xmlns="http://www.w3.org/1999/xhtml"><head><title>导读</title><link rel="stylesheet" href="style.css"/></head><body><p>综合评价最容易被误解成“找一个公式，把很多指标压成一个总分”。其实，真正困难的不是最后那一步加权求和，而是此前的一连串判断：<strong>评价对象是否可比，指标方向是否统一，权重究竟表达偏好还是数据差异，模型输出能不能回答原问题，排名又是否经得住扰动。</strong></p>
<p>这本书从一条完整的评价链出发：</p>
<div class="math-block"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><mrow><mtext>评价目的</mtext><mi>⟶</mi><mtext>指标与数据</mtext><mi>⟶</mi><mtext>同向化和无量纲化</mtext><mi>⟶</mi><mtext>赋权或信息提取</mtext><mi>⟶</mi><mtext>合成、排序或分级</mtext><mi>⟶</mi><mtext>稳健性检验</mtext></mrow></math></div>
<p>把这条链看清以后，AHP、熵权法、TOPSIS、灰色关联、模糊综合评价、秩和比、主成分分析、因子分析、投影寻踪和 DEA 就不再是一串彼此竞争的名词，而是工具箱中解决不同环节、不同问题的工具。</p>
<hr/>
